<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="skin">
      <stop offset="0%" stop-color="#E8C8A0"/>
      <stop offset="100%" stop-color="#D8B080"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- Body/shoulders -->
    <ellipse cx="100" cy="215" rx="95" ry="65" fill="#059669"/>
    <!-- Neck -->
    <rect x="85" y="147" width="30" height="46" rx="8" fill="url(#skin)"/>
    <!-- Dark hair — back layer first -->
    <ellipse cx="100" cy="85"  rx="52" ry="55" fill="#2A1A0A"/>
    <!-- Curly hair sides -->
    <ellipse cx="55"  cy="120" rx="26" ry="42" fill="#2A1A0A"/>
    <ellipse cx="145" cy="115" rx="24" ry="38" fill="#2A1A0A"/>
    <!-- Hair curls detail -->
    <ellipse cx="50"  cy="108" rx="14" ry="20" fill="#3A2A0A"/>
    <ellipse cx="148" cy="105" rx="12" ry="18" fill="#3A2A0A"/>
    <ellipse cx="58"  cy="135" rx="16" ry="22" fill="#3A2A0A"/>
    <ellipse cx="142" cy="128" rx="14" ry="20" fill="#3A2A0A"/>
    <!-- Face -->
    <ellipse cx="100" cy="106" rx="43" ry="50" fill="url(#skin)"/>
    <!-- Hair top front -->
    <ellipse cx="100" cy="72" rx="46" ry="34" fill="#2A1A0A"/>
    <!-- Hair highlight -->
    <ellipse cx="88"  cy="66" rx="12" ry="16" fill="#4A3A20" opacity="0.45"/>
    <!-- Forehead skin -->
    <ellipse cx="100" cy="88" rx="38" ry="22" fill="url(#skin)"/>
    <!-- Earrings -->
    <circle cx="58"  cy="113" r="5" fill="#F59E0B"/>
    <circle cx="142" cy="110" r="5" fill="#F59E0B"/>
    <!-- Eyebrows — arched -->
    <path d="M80,96 Q89,91 98,95" stroke="#2A1A0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M102,95 Q111,91 120,96" stroke="#2A1A0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="88"  cy="105" rx="8.5" ry="7" fill="white"/>
    <ellipse cx="112" cy="105" rx="8.5" ry="7" fill="white"/>
    <circle cx="89"  cy="105" r="5"   fill="#3A2A10"/>
    <circle cx="113" cy="105" r="5"   fill="#3A2A10"/>
    <circle cx="91"  cy="103" r="1.8" fill="white"/>
    <circle cx="115" cy="103" r="1.8" fill="white"/>
    <!-- Lashes -->
    <path d="M80,100 Q84,96 96,100" stroke="#1A0A00" stroke-width="1.8" fill="none"/>
    <path d="M104,100 Q116,96 120,100" stroke="#1A0A00" stroke-width="1.8" fill="none"/>
    <!-- Nose -->
    <ellipse cx="100" cy="118" rx="5.5" ry="3.5" fill="#C49060" opacity="0.5"/>
    <!-- Big warm smile -->
    <path d="M86,131 Q100,145 114,131" stroke="#B06848" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M86,131 Q100,143 114,131" fill="#E09880" opacity="0.35"/>
    <!-- Cheek blush -->
    <ellipse cx="73"  cy="120" rx="11" ry="8" fill="#EE8888" opacity="0.22"/>
    <ellipse cx="127" cy="120" rx="11" ry="8" fill="#EE8888" opacity="0.22"/>
    <!-- Lip gloss hint -->
    <ellipse cx="100" cy="133" rx="11" ry="4" fill="#E0A898" opacity="0.4"/>
  </g>
</svg>
