<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="skin">
      <stop offset="0%" stop-color="#F0D0A8"/>
      <stop offset="100%" stop-color="#E0B888"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- Body/shoulders -->
    <ellipse cx="100" cy="215" rx="95" ry="65" fill="#1E3A5F"/>
    <!-- Shirt collar white -->
    <polygon points="88,165 100,175 112,165 115,200 85,200" fill="white" opacity="0.9"/>
    <!-- Tie hint -->
    <polygon points="100,170 96,178 100,200 104,178" fill="#CC2222" opacity="0.8"/>
    <!-- Neck -->
    <rect x="85" y="148" width="30" height="44" rx="7" fill="url(#skin)"/>
    <!-- Hair (short, grey/silver) -->
    <ellipse cx="100" cy="82" rx="48" ry="42" fill="#9AA5B0"/>
    <!-- Face -->
    <ellipse cx="100" cy="107" rx="44" ry="50" fill="url(#skin)"/>
    <!-- Hair top shows over face -->
    <ellipse cx="100" cy="72" rx="44" ry="30" fill="#9AA5B0"/>
    <!-- Temple grey -->
    <ellipse cx="58"  cy="105" rx="14" ry="20" fill="#9AA5B0"/>
    <ellipse cx="142" cy="105" rx="14" ry="20" fill="#9AA5B0"/>
    <!-- Forehead skin -->
    <ellipse cx="100" cy="88" rx="38" ry="22" fill="url(#skin)"/>
    <!-- Glasses frames -->
    <rect x="76"  cy="101" x2="76"  y="99" width="30" height="18" rx="5" fill="none" stroke="#3A2A18" stroke-width="2.5"/>
    <rect x="94"  y="101" width="30" height="18" rx="5" fill="none" stroke="#3A2A18" stroke-width="2.5"/>
    <line x1="106" y1="110" x2="94"  y2="110" stroke="#3A2A18" stroke-width="2.5"/>
    <!-- Glasses arms -->
    <line x1="76"  y1="110" x2="62"  y2="112" stroke="#3A2A18" stroke-width="2.2"/>
    <line x1="124" y1="110" x2="138" y2="112" stroke="#3A2A18" stroke-width="2.2"/>
    <!-- Lens tint -->
    <rect x="77"  y="100" width="28" height="16" rx="4" fill="#B8D0E8" opacity="0.2"/>
    <rect x="95"  y="100" width="28" height="16" rx="4" fill="#B8D0E8" opacity="0.2"/>
    <!-- Eyes behind glasses -->
    <circle cx="91"  cy="109" r="5" fill="#3A2A18"/>
    <circle cx="109" cy="109" r="5" fill="#3A2A18"/>
    <circle cx="93"  cy="107" r="1.5" fill="white"/>
    <circle cx="111" cy="107" r="1.5" fill="white"/>
    <!-- Eyebrows (above glasses) -->
    <path d="M78,97 Q91,93 105,97" stroke="#5A4A38" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M95,97 Q109,93 122,97" stroke="#5A4A38" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="100" cy="120" rx="6" ry="4" fill="#D0A060" opacity="0.5"/>
    <!-- Warm smile (slight) -->
    <path d="M88,134 Q100,143 112,134" stroke="#B87050" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheek lines (age hint) -->
    <path d="M72,118 Q70,125 72,130" stroke="#D0A060" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M128,118 Q130,125 128,130" stroke="#D0A060" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Moustache hint -->
    <path d="M92,127 Q100,129 108,127" stroke="#8A7068" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
