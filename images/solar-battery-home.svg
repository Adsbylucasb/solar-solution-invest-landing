<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#ECEEF2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#C4A882"/>
    </linearGradient>
    <linearGradient id="batteryBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C2532"/>
      <stop offset="50%" stop-color="#242E3E"/>
      <stop offset="100%" stop-color="#1A2230"/>
    </linearGradient>
    <linearGradient id="batteryFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3444"/>
      <stop offset="100%" stop-color="#1E2838"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#061020"/>
    </linearGradient>
    <linearGradient id="chargeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="solarFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="battShadow">
      <feDropShadow dx="6" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

  <!-- Room wall -->
  <rect width="800" height="520" fill="url(#wallBg)"/>

  <!-- Baseboard / floor -->
  <rect x="0" y="445" width="800" height="75" fill="url(#floor)"/>
  <!-- Floor highlight -->
  <rect x="0" y="445" width="800" height="6" fill="#DCC0A0" opacity="0.6"/>
  <!-- Baseboard -->
  <rect x="0" y="442" width="800" height="7" fill="#E0D8CC"/>

  <!-- Wall subtle texture — panel lines -->
  <g stroke="#E2E6EA" stroke-width="1" opacity="0.55">
    <line x1="0"   y1="120" x2="800" y2="120"/><line x1="0"   y1="240" x2="800" y2="240"/>
    <line x1="0"   y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0"   x2="200" y2="445"/><line x1="400" y1="0"   x2="400" y2="445"/>
    <line x1="600" y1="0"   x2="600" y2="445"/>
  </g>

  <!-- Ambient window light (left) — suggests window off-frame -->
  <rect x="0" y="60" width="120" height="280" fill="#F59E0B" opacity="0.04"/>
  <line x1="0" y1="60"  x2="180" y2="200" stroke="#FDE68A" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="340" x2="180" y2="240" stroke="#FDE68A" stroke-width="1" opacity="0.10"/>

  <!-- Conduit / cable channel on wall -->
  <rect x="396" y="50" width="8" height="170" rx="3" fill="#D0D4D8"/>

  <!-- BATTERY UNIT (Tesla Powerwall-style) -->
  <g filter="url(#battShadow)">
    <!-- Main body -->
    <rect x="270" y="55" width="260" height="375" rx="18" fill="url(#batteryBody)"/>
    <!-- Face plate (slightly inset) -->
    <rect x="280" y="65" width="240" height="355" rx="14" fill="url(#batteryFace)"/>
    <!-- Top edge highlight -->
    <rect x="270" y="55" width="260" height="12" rx="9" fill="#2E3A4E"/>
    <!-- Left edge sheen -->
    <rect x="270" y="55" width="8" height="375" rx="4" fill="#3A4658" opacity="0.5"/>

    <!-- STATUS SCREEN (upper section) -->
    <rect x="296" y="86" width="208" height="140" rx="10" fill="url(#screenBg)"/>
    <!-- Screen inner glow -->
    <rect x="298" y="88" width="204" height="136" rx="8" fill="#0A2040" opacity="0.4"/>

    <!-- Solar production value -->
    <text x="400" y="120" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#F59E0B" opacity="0.8">PRODUCTION SOLAIRE</text>
    <text x="400" y="148" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="800" fill="#FDE68A">8,4 kW</text>
    <text x="400" y="168" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#7ABCDE" opacity="0.8">↑ Flux en temps réel</text>

    <!-- Divider -->
    <line x1="310" y1="186" x2="490" y2="186" stroke="#1A4A7A" stroke-width="0.8" opacity="0.6"/>

    <!-- Battery % -->
    <text x="400" y="208" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#A0C8E8" opacity="0.8">CHARGE BATTERIE</text>
    <text x="400" y="220" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#34D399">82 %</text>

    <!-- CHARGE BAR -->
    <rect x="296" y="238" width="208" height="14" rx="7" fill="#0A1828"/>
    <rect x="298" y="240" width="170" height="10" rx="5" fill="url(#chargeBar)"/>
    <!-- Charge bar glow -->
    <rect x="298" y="240" width="170" height="5" rx="3" fill="white" opacity="0.12"/>

    <!-- ENERGY FLOW DIAGRAM (middle section) -->
    <!-- Solar icon -->
    <circle cx="340" cy="295" r="18" fill="#1A2A3A"/>
    <circle cx="340" cy="295" r="11" fill="#F59E0B" opacity="0.9"/>
    <g stroke="#F59E0B" stroke-width="1.5" opacity="0.6">
      <line x1="340" y1="272" x2="340" y2="266"/><line x1="340" y1="318" x2="340" y2="324"/>
      <line x1="317" y1="295" x2="311" y2="295"/><line x1="363" y1="295" x2="369" y2="295"/>
      <line x1="324" y1="279" x2="320" y2="275"/><line x1="356" y1="279" x2="360" y2="275"/>
    </g>
    <!-- Arrow solar → battery -->
    <line x1="358" y1="295" x2="385" y2="295" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <polygon points="383,291 390,295 383,299" fill="#F59E0B" opacity="0.7"/>

    <!-- Battery icon center -->
    <rect x="390" y="282" width="20" height="26" rx="3" fill="#1E2A3A"/>
    <rect x="393" y="280" width="14" height="4" rx="2" fill="#2A3A4A"/>
    <rect x="392" y="284" width="16" height="22" rx="2" fill="#10B981" opacity="0.85"/>
    <rect x="392" y="294" width="16" height="12" rx="1" fill="#0A1828" opacity="0.3"/>

    <!-- Arrow battery → home -->
    <line x1="410" y1="295" x2="435" y2="295" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <polygon points="433,291 440,295 433,299" fill="#10B981" opacity="0.7"/>

    <!-- Home icon -->
    <circle cx="458" cy="295" r="18" fill="#1A2A3A"/>
    <polygon points="458,279 445,292 471,292" fill="#7ABCDE" opacity="0.85"/>
    <rect x="450" y="292" width="16" height="14" rx="1" fill="#7ABCDE" opacity="0.75"/>
    <rect x="455" y="296" width="6" height="10" rx="1" fill="#1A2A3A"/>

    <!-- Status labels -->
    <text x="340" y="324" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#F59E0B" opacity="0.75">Solaire</text>
    <text x="400" y="318" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#10B981" opacity="0.75">82%</text>
    <text x="458" y="324" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#7ABCDE" opacity="0.75">Maison</text>

    <!-- Bottom stats row -->
    <line x1="296" y1="342" x2="504" y2="342" stroke="#1A3A5A" stroke-width="0.8" opacity="0.5"/>
    <text x="344" y="362" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#A0C8E8" opacity="0.7">Aujourd'hui</text>
    <text x="344" y="376" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#FDE68A">42 kWh</text>
    <line x1="400" y1="348" x2="400" y2="388" stroke="#1A3A5A" stroke-width="0.8" opacity="0.4"/>
    <text x="456" y="362" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#A0C8E8" opacity="0.7">Économisé</text>
    <text x="456" y="376" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#34D399">8,40 €</text>

    <!-- Model/brand area -->
    <rect x="296" y="398" width="208" height="14" rx="3" fill="#141E2E" opacity="0.6"/>
    <text x="400" y="409" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#5A7A9A" opacity="0.7">Solar Solution Invest · Système v3.2</text>
  </g>

  <!-- Mounting bracket shadows on wall -->
  <rect x="282" y="48" width="16" height="14" rx="3" fill="#C8CCD2" opacity="0.7"/>
  <rect x="502" y="48" width="16" height="14" rx="3" fill="#C8CCD2" opacity="0.7"/>
  <rect x="282" y="415" width="16" height="14" rx="3" fill="#C8CCD2" opacity="0.7"/>
  <rect x="502" y="415" width="16" height="14" rx="3" fill="#C8CCD2" opacity="0.7"/>

  <!-- Capacity badge (top-left) -->
  <rect x="28" y="22" width="136" height="62" rx="12" fill="#0C1445" opacity="0.96"/>
  <text x="96" y="44" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="white">Jusqu'à 30 kWh</text>
  <text x="96" y="65" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.88)">Stockage modulable</text>

  <!-- Autonomy badge (top-right) -->
  <rect x="636" y="22" width="136" height="62" rx="12" fill="#10B981" opacity="0.96"/>
  <text x="704" y="44" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="white">90 %</text>
  <text x="704" y="65" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Autonomie possible</text>
</svg>
