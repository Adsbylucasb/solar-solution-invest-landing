<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050B1A"/>
      <stop offset="45%" stop-color="#0D1E3D"/>
      <stop offset="80%" stop-color="#142B52"/>
      <stop offset="100%" stop-color="#1A3A6E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="68%" r="32%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonLight" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#1a4a9a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a4a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1E38"/>
      <stop offset="60%" stop-color="#071428"/>
      <stop offset="100%" stop-color="#040C18"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2B3E"/>
      <stop offset="100%" stop-color="#111D2D"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C2818"/>
      <stop offset="100%" stop-color="#050F09"/>
    </linearGradient>
    <pattern id="cells" width="22" height="15" patternUnits="userSpaceOnUse">
      <line x1="0" y1="7.5" x2="22" y2="7.5" stroke="#1040A0" stroke-width="0.7" opacity="0.6"/>
      <line x1="11" y1="0" x2="11" y2="15" stroke="#1040A0" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <filter id="houseShad" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="winGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#horizonLight)"/>
  <ellipse cx="1040" cy="600" rx="260" ry="200" fill="url(#sunGlow)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="75"  cy="48"  r="1.2" opacity="0.85"/><circle cx="155" cy="22"  r="0.8" opacity="0.65"/>
    <circle cx="228" cy="75"  r="1.4" opacity="0.80"/><circle cx="315" cy="38"  r="1.0" opacity="0.90"/>
    <circle cx="400" cy="18"  r="0.8" opacity="0.55"/><circle cx="470" cy="65"  r="1.3" opacity="0.80"/>
    <circle cx="555" cy="30"  r="0.9" opacity="0.70"/><circle cx="640" cy="55"  r="0.7" opacity="0.60"/>
    <circle cx="710" cy="15"  r="1.1" opacity="0.75"/><circle cx="790" cy="68"  r="0.9" opacity="0.65"/>
    <circle cx="870" cy="28"  r="1.2" opacity="0.85"/><circle cx="960" cy="50"  r="0.7" opacity="0.55"/>
    <circle cx="1040" cy="18" r="1.0" opacity="0.80"/><circle cx="1115" cy="42" r="0.8" opacity="0.45"/>
    <circle cx="1200" cy="30" r="1.3" opacity="0.75"/><circle cx="1295" cy="58" r="1.0" opacity="0.70"/>
    <circle cx="1375" cy="25" r="1.1" opacity="0.80"/><circle cx="110"  cy="128" r="0.7" opacity="0.45"/>
    <circle cx="205"  cy="152" r="1.0" opacity="0.65"/><circle cx="348"  cy="115" r="0.8" opacity="0.60"/>
    <circle cx="492"  cy="142" r="1.2" opacity="0.75"/><circle cx="628"  cy="108" r="0.6" opacity="0.50"/>
    <circle cx="755"  cy="138" r="0.9" opacity="0.65"/><circle cx="905"  cy="122" r="1.1" opacity="0.70"/>
    <circle cx="1055" cy="108" r="0.7" opacity="0.45"/><circle cx="1162" cy="138" r="1.0" opacity="0.65"/>
    <circle cx="1325" cy="125" r="0.8" opacity="0.60"/>
  </g>

  <!-- Moon -->
  <circle cx="1308" cy="95" r="30" fill="#D0DCF0" opacity="0.92"/>
  <circle cx="1323" cy="87" r="26" fill="#0D1E3D"/>

  <!-- Tree silhouettes — left -->
  <g fill="#05100A">
    <ellipse cx="55"  cy="548" rx="92"  ry="158"/><ellipse cx="55"  cy="475" rx="68"  ry="102"/>
    <rect x="45"  y="640" width="18" height="52"/>
    <ellipse cx="172" cy="568" rx="78"  ry="138"/><ellipse cx="175" cy="508" rx="52"  ry="82"/>
    <rect x="165" y="652" width="15" height="40"/>
  </g>

  <!-- Tree silhouettes — right -->
  <g fill="#05100A">
    <ellipse cx="1385" cy="542" rx="88"  ry="152"/><ellipse cx="1380" cy="470" rx="63"  ry="98"/>
    <rect x="1375" y="638" width="18" height="52"/>
    <ellipse cx="1268" cy="562" rx="74"  ry="132"/><ellipse cx="1263" cy="502" rx="48"  ry="78"/>
    <rect x="1258" y="648" width="15" height="40"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="692" width="1440" height="208" fill="url(#groundGrad)"/>

  <!-- Driveway path -->
  <polygon points="678,692 762,692 816,900 624,900" fill="#111E14" opacity="0.9"/>
  <polygon points="700,692 740,692 778,900 662,900" fill="#162218" opacity="0.45"/>

  <!-- HOUSE GROUP -->
  <g filter="url(#houseShad)">

    <!-- Garage (right wing) -->
    <rect x="1060" y="557" width="178" height="135" fill="url(#wallGrad)"/>
    <polygon points="1060,557 1238,557 1238,478 1060,557" fill="url(#roofGrad)" opacity="0.85"/>
    <rect x="1068" y="578" width="162" height="114" fill="#09121E"/>
    <line x1="1068" y1="614" x2="1230" y2="614" stroke="#1A3A5E" stroke-width="1.5" opacity="0.55"/>
    <line x1="1068" y1="650" x2="1230" y2="650" stroke="#1A3A5E" stroke-width="1.5" opacity="0.55"/>
    <line x1="1149" y1="578" x2="1149" y2="692" stroke="#1A3A5E" stroke-width="1.5" opacity="0.55"/>
    <circle cx="1149" cy="598" r="4" fill="#FDE68A" opacity="0.35"/>

    <!-- Main house wall -->
    <rect x="382" y="468" width="678" height="224" fill="url(#wallGrad)"/>

    <!-- Roof -->
    <polygon points="338,468 721,238 1104,468" fill="url(#roofGrad)"/>
    <!-- Roof ridge highlight -->
    <line x1="338" y1="468" x2="721" y2="238" stroke="white" stroke-width="1" opacity="0.06"/>
    <line x1="721" y1="238" x2="1104" y2="468" stroke="white" stroke-width="1" opacity="0.03"/>

    <!-- Chimney -->
    <rect x="802" y="298" width="46" height="84" fill="#080E1C"/>
    <rect x="795" y="293" width="60" height="12" rx="2" fill="#0C1225"/>
    <ellipse cx="822" cy="282" rx="9" ry="6" fill="#1A2A40" opacity="0.4"/>
    <ellipse cx="818" cy="265" rx="7" ry="4.5" fill="#1A2A40" opacity="0.22"/>

  </g><!-- end house group -->

  <!-- SOLAR PANELS on left roof slope (12 panels: 4 cols x 3 rows) -->
  <g>
    <!-- Row 1 (top) -->
    <g transform="translate(455,326) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(523,295) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(591,264) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(659,233) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <!-- Row 2 -->
    <g transform="translate(455,373) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(523,342) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(591,311) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(659,280) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <!-- Row 3 -->
    <g transform="translate(455,420) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(523,389) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(591,358) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <g transform="translate(659,327) rotate(-28.5)"><rect width="64" height="45" rx="2" fill="url(#panelGrad)"/><rect width="64" height="45" rx="2" fill="url(#cells)"/><rect width="64" height="45" rx="2" fill="none" stroke="#0C3070" stroke-width="1"/><rect x="1" y="1" width="62" height="5" fill="white" opacity="0.05"/></g>
    <!-- Panel area blue reflection -->
    <ellipse cx="582" cy="362" rx="125" ry="52" fill="#0EA5E9" opacity="0.05"/>
  </g>

  <!-- Ground floor windows -->
  <g filter="url(#winGlow)">
    <rect x="420" y="512" width="108" height="88" rx="4" fill="#FDE68A" opacity="0.72"/>
    <rect x="420" y="512" width="108" height="88" rx="4" fill="none" stroke="#1A2E44" stroke-width="2"/>
    <line x1="420" y1="556" x2="528" y2="556" stroke="#1A2E44" stroke-width="1.5" opacity="0.5"/>
    <line x1="474" y1="512" x2="474" y2="600" stroke="#1A2E44" stroke-width="1.5" opacity="0.5"/>

    <rect x="835" y="512" width="108" height="88" rx="4" fill="#FDE68A" opacity="0.67"/>
    <rect x="835" y="512" width="108" height="88" rx="4" fill="none" stroke="#1A2E44" stroke-width="2"/>
    <line x1="835" y1="556" x2="943" y2="556" stroke="#1A2E44" stroke-width="1.5" opacity="0.5"/>
    <line x1="889" y1="512" x2="889" y2="600" stroke="#1A2E44" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Dormer windows -->
  <g>
    <polygon points="572,383 597,360 622,383" fill="url(#roofGrad)"/>
    <rect x="572" y="373" width="50" height="46" rx="3" fill="#FDE68A" opacity="0.62"/>
    <rect x="572" y="373" width="50" height="46" rx="3" fill="none" stroke="#1A2E44" stroke-width="1.5"/>
    <line x1="597" y1="373" x2="597" y2="419" stroke="#1A2E44" stroke-width="1" opacity="0.45"/>

    <polygon points="780,398 805,375 830,398" fill="url(#roofGrad)"/>
    <rect x="780" y="388" width="50" height="46" rx="3" fill="#FDE68A" opacity="0.57"/>
    <rect x="780" y="388" width="50" height="46" rx="3" fill="none" stroke="#1A2E44" stroke-width="1.5"/>
    <line x1="805" y1="388" x2="805" y2="434" stroke="#1A2E44" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Window light on ground -->
  <ellipse cx="474" cy="698" rx="68" ry="20" fill="#F59E0B" opacity="0.09"/>
  <ellipse cx="889" cy="698" rx="68" ry="20" fill="#F59E0B" opacity="0.07"/>

  <!-- Door -->
  <rect x="663" y="567" width="80" height="125" rx="5" fill="#09131F"/>
  <rect x="663" y="567" width="80" height="125" rx="5" fill="none" stroke="#1A2E44" stroke-width="2"/>
  <rect x="669" y="574" width="68" height="36" rx="3" fill="#FDE68A" opacity="0.42"/>
  <rect x="669" y="620" width="30" height="42" rx="2" fill="#0E1D2E" stroke="#1A2E44" stroke-width="1"/>
  <rect x="707" y="620" width="30" height="42" rx="2" fill="#0E1D2E" stroke="#1A2E44" stroke-width="1"/>
  <circle cx="726" cy="643" r="4.5" fill="#C4A830"/>
  <!-- Porch light -->
  <rect cx="699" cy="555" x="697" y="555" width="8" height="14" rx="2" fill="#C4A830"/>
  <ellipse cx="701" cy="566" rx="14" ry="8" fill="#FDE68A" opacity="0.30"/>

  <!-- Bushes -->
  <g fill="#08200E"><ellipse cx="398" cy="692" rx="58" ry="38"/><ellipse cx="388" cy="678" rx="48" ry="30"/></g>
  <g fill="#0A2510"><ellipse cx="648" cy="692" rx="36" ry="26"/><ellipse cx="643" cy="682" rx="28" ry="20"/></g>
  <g fill="#08200E"><ellipse cx="756" cy="692" rx="36" ry="26"/><ellipse cx="762" cy="682" rx="28" ry="20"/></g>
  <g fill="#0A2510"><ellipse cx="1062" cy="692" rx="56" ry="38"/><ellipse cx="1068" cy="678" rx="46" ry="30"/></g>

  <!-- Ground house shadow -->
  <ellipse cx="720" cy="697" rx="360" ry="26" fill="black" opacity="0.14"/>

  <!-- City glow horizon -->
  <ellipse cx="720" cy="692" rx="420" ry="55" fill="#1A3A7A" opacity="0.20"/>

  <!-- Subtle night vignette -->
  <rect width="1440" height="900" fill="#000D22" opacity="0.06"/>
</svg>
